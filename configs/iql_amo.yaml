# AMO feat/iql-amo-bpi (7068c765), recorded beta_init=1, rho_lr=0.002 profile.
defaults:
  beta_initial: 1.0
  rho_lr: 0.002
  meta_warmup_steps: 100000
  meta_interval: 20
  final_eval_repeats: 5
antmaze:
  expectile: 0.9
  reward_transform: antmaze_shift
  eval_episodes: 100
environments:
  hopper-medium-v2:
    reward_transform: return_range
  hopper-medium-replay-v2:
    reward_transform: return_range
  hopper-medium-expert-v2:
    expectile: 0.5
