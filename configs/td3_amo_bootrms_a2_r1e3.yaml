# TD3-AMO candidate-main: bootstrap_loss=l2_rms (no L1 on α_B).
# alpha_E=alpha_B=2, alpha_lr=0.001, reward_transform=none.
defaults:
  alpha_E: 2
  alpha_B: 2
  alpha_lr: 0.001
  bootstrap_loss: l2_rms
  execution_score: bpi
  execution_only: false
  reward_transform: none
antmaze:
  reward_transform: none
  eval_episodes: 100
environments:
  hopper-medium-v2:
    reward_transform: none
  hopper-medium-replay-v2:
    reward_transform: none
  hopper-medium-expert-v2:
    reward_transform: none
  walker2d-medium-v2:
    reward_transform: none
  walker2d-medium-replay-v2:
    reward_transform: none
  walker2d-medium-expert-v2:
    reward_transform: none
  halfcheetah-medium-v2:
    reward_transform: none
  halfcheetah-medium-replay-v2:
    reward_transform: none
  halfcheetah-medium-expert-v2:
    reward_transform: none
