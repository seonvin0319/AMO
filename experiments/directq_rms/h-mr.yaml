defaults:
  batch_size: 256
  hidden_dim: 256
  discount: 0.99
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  max_steps: 1000000
  normalize: true
  reward_transform: none
  eval_freq: 20000
  eval_episodes: 10
  eval_seed: null
  eval_first_step: 20000
  final_eval_repeats: 5
  actor_depth: 2
  critic_depth: 3
  critic_layernorm: true
  critic_special_init: true
  policy_freq: 2
  policy_noise: 0.2
  noise_clip: 0.5
  alpha_E: 5
  alpha_B: 5
  bootstrap_loss: l2_rms
  alpha_lr: 0.002
  meta_interval: 20
  smoothness_eps: 1.0e-06
  execution_score: direct_q
  execution_only: false
  execution_meta_loss: le
  critic_target: bootstrap
